# #######################################################################################
# HYPRLAND CONFIG — "THE BATMAN" (2022) THEME
# Gotham after dark: near-black, electric blue, sodium-lamp amber, rain steel.
# Structure adapted from github.com/parazeeknova/dotfiles
# Palette
#   bg0 #0a0a0c   bg1 #121216   bg2 #191920   bg3 #26262f
#   fg  #d8d9de   dim  #85868f
#   blue #125bc1  blue-dark #0c3a7a  blue-bright #3880e5
#   amber #d97a2b amber-bright #f0a04b   steel #6b8299   olive #8ba36f
# Original configs backed up in ~/.config/theme-backups/
# #######################################################################################

# Palette variables
$bg0         = rgba(0a0a0cff)
$bg1         = rgba(121216ff)
$bg2         = rgba(191920ff)
$bg3         = rgba(26262fff)
$fg          = rgba(d8d9deff)
$dim         = rgba(85868fff)
$blue         = rgba(125bc1ff)
$blue_dark    = rgba(0c3a7aff)
$blue_bright  = rgba(3880e5ff)
$amber       = rgba(d97a2bff)
$amber_bright = rgba(f0a04bff)
$steel       = rgba(6b8299ff)
$shadow      = rgba(000000aa)

################
### MONITORS ###
################

monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.local/bin/desktop-widget
exec-once = ~/.local/bin/ws-sound


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1

    # The Batman (2022): electric-blue signal fading into Gotham black
    col.active_border = $blue $blue_dark 45deg
    col.inactive_border = $bg3

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2

    active_opacity = 0.97
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.08

    # Graphite-style shadow: tight, faint, no hard core.
    # Tuned to Graphite-Dark's own spec (layered 2-6px shadows at 12-20% black).
    # History: 14/3 @ d9 (original) → 22/4 @ d9 (too heavy) → this.
    # Restore originals with ~/.config/hypr/hyprland.conf.bak-shadow-pre
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = $shadow
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.18
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0     # no anime mascot wallpapers
    disable_hyprland_logo = true    # clean Batcave boot screen
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ir
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, ~/.local/bin/bluetooth-menu   # bluetooth manager

# Window management
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, M, exit
bind = $mainMod SHIFT, P, pin          # pin/unpin (keep on top, all workspaces)
bind = $mainMod, L, exec, hyprlock     # lock screen

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move the active window: swap places with the neighbour in that direction
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Resize the active window (hold the key to keep resizing)
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Send the active window to a workspace WITHOUT following it
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# Move the active window to the previous/next workspace (and follow it)
bind = $mainMod ALT, left, movetoworkspace, e-1
bind = $mainMod ALT, right, movetoworkspace, e+1

# Jump back to the last used workspace
bind = $mainMod, TAB, workspace, previous

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspace scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume / brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/brightness down

# Same thing on keys every keyboard has (hold to ramp)
binde = $mainMod, equal, exec, ~/.local/bin/brightness up
binde = $mainMod, minus, exec, ~/.local/bin/brightness down

# Media
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = $mainMod, N, exec, playerctl next          # next song
bindl = $mainMod SHIFT, N, exec, playerctl previous # previous song
bindl = $mainMod, space, exec, playerctl play-pause # play / pause
bindl = $mainMod SHIFT, space, exec, playerctl stop # stop

# Utilities
bind = $mainMod, Escape, exec, wlogout -b 5
bind = $mainMod SHIFT, V, exec, ~/.local/bin/clipboard-history
bind = , Print, exec, ~/.local/bin/screenshot region
bind = SHIFT, Print, exec, ~/.local/bin/screenshot full
bind = $mainMod, Print, exec, ~/.local/bin/screenshot window


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

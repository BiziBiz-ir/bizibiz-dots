# Hyprlock — "The Batman" (2022) lock screen (matches Hyprland/kitty/waybar theme)

$font = JetBrains Mono

# Palette
$bg0        = rgba(10, 10, 12, 0.65)
$fg         = rgba(216, 217, 222, 1.0)
$dim        = rgba(133, 134, 143, 1.0)
$blue        = rgba(18, 91, 193, 1.0)
$blue_dark   = rgba(12, 58, 122, 1.0)
$blue_bright = rgba(56, 128, 229, 1.0)
$amber      = rgba(240, 160, 75, 1.0)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.45
    contrast = 0.9
}

# Bat-signal title
label {
    monitor =
    text = — THE BATMAN —
    font_size = 16
    font_family = $font
    color = $blue

    position = 0, -200
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $blue_bright

    position = 0, -125
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = $fg

    position = 0, -45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 1
    rounding = 6
    inner_color = $bg0
    outer_color = $blue $blue_dark 45deg
    check_color = $amber
    fail_color = $blue_bright
    font_color = $fg

    fade_on_empty = false
    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    dots_size = 0.28

    position = 0, 90
    halign = center
    valign = center
}
